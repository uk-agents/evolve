name: Agent task
description: Propose a bounded task for Evolve to implement through a pull request.
title: "[agent] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What observable problem or requirement should be addressed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must hold when the task is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: State boundaries, compatibility requirements, and work that is explicitly out of scope.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which tests, checks, or observed behaviour should count as evidence?
